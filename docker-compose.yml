version: '3.8'

services:
  # 1. Distributed In-Memory Cache for Concurrency Locking (10-minute slot hold)
  redis:
    image: redis:7.2-alpine
    container_name: smartev-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Python FastAPI ML Microservice (XGBoost SOH, RUL, Station Demand & Heuristic AI)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smartev-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Java Spring Boot 3 Enterprise Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartev-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - ML_SERVICE_URL=http://ml-service:8000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  # 4. React 18 + Vite Tailwind Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartev-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: smartev-network
